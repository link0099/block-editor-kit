.note-rich-toolbar{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}.note-rich-toolbar button{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;min-width:26px;min-height:26px;padding:0;border:0;border-radius:5px;background:transparent;color:var(--muted)}.note-rich-toolbar button:hover{background:var(--surface-hover);color:var(--text)}.note-rich-toolbar button:focus-visible{outline:2px solid var(--muted);outline-offset:1px}.note-rich-toolbar .note-tool-red{color:#e34242}.note-rich-toolbar .note-tool-green{color:#129966}.note-rich-toolbar .note-tool-yellow{color:#b58a16}

<body>
  <header class="demo-header">
    <div><p class="demo-kicker">INTERACTIVE DEMO · 0.2.3 PREVIEW</p><h1>Block Editor Kit</h1>
      <p>不用下载安装。直接试用 Notion 式块编辑器，体验文本与整块的不同复制方式。</p></div>
    <nav class="demo-actions" aria-label="演示操作">
      <a href="https://github.com/link0099/block-editor-kit">GitHub 源码</a>
      <button id="theme" type="button" aria-pressed="false">深色模式</button>
      <button id="reset" type="button">恢复示例</button>
    </nav>
  </header>
  <section class="demo-steps" aria-label="30 秒试用">
    <p><strong>01 · 只复制文字</strong><br>三击「测试」，复制后粘贴到末尾，得到一行「测试测试」。</p>
    <p><strong>02 · 复制整块</strong><br>点「测试」左侧六点，复制；按 Esc 后把光标放回行末再粘贴，新增一个编号项。</p>
  </section>
  <output id="status" aria-live="polite">编辑仅保存在当前浏览器</output>
